# How runs behave in this environment. What lands, and where, is in the pipeline definitions;
# this file states everything operational, and every framework key below is required.
#
# Precedence, highest first: environment variables (RETRY__ATTEMPTS=3), then a per-pipeline
# section, then the shared one. A per-pipeline section only needs the keys it changes:
#
#   [pipelines.acme_shop.retry]
#   give_up_after_s = 3600
#
# Secrets (monitoring.uri, credentials) go in .dlt/secrets.toml or the environment.

[logging]
format = "text"   # text | json (any registered log format)
level = "INFO"

[retry]
# A failing step (sync, extract, normalize, load) is retried only for errors known to heal (the
# network, a busy or restarting database), with jittered exponential waits from initial_wait_s up
# to max_wait_s, giving up after `attempts` or once give_up_after_s has passed. Anything else
# fails at once: bad credentials, a schema contract, out of memory, an unknown error.
#
# This only rides out a blip. Longer outages are the scheduler's: the run exits 4, keeps its
# extracted package, and the next run loads it without extracting again. Under an orchestrator
# that retries exit 4 itself, set attempts = 1, so no container is billed while it waits; then
# keep DLT_DATA_DIR on persistent storage, or the retry extracts again. Never retry exits 2, 3, or 5.
attempts = 3
initial_wait_s = 5
max_wait_s = 60
give_up_after_s = 120

[monitoring]
# Memory and CPU are sampled every sample_every_s and written every flush_every_s, so a run
# killed for OOM still leaves its memory trend. uri is a secret.
sample_every_s = 15
flush_every_s = 60

[guards]
# A time cursor further than this ahead of now is refused before it is committed: one row dated
# in the future would otherwise stop the cursor until that date. Covers clock skew between the
# source and this host.
future_cursor_tolerance_s = 3600

# ---- dlt -------------------------------------------------------------------------------------

[runtime]
# dlt speaks only when something is wrong; the framework logs progress and writes monitoring
# frames. Its lines go through the framework's handler, so [logging] format controls every line.
log_level = "WARNING"
# dlt's HTTP client (REST sources) retries each request itself before a step fails.
request_max_attempts = 5
request_backoff_factor = 1
request_max_retry_delay = 300

[extract]
# Resources of one source extract in parallel threads. Serialise a rate-limited upstream with
# [sources.<source name>.extract] workers = 1.
workers = 5

[data_writer]
# Rotate intermediate files so one large table normalizes and loads in parallel.
file_max_items = 100000

[normalize]
workers = 3
# Workers start as fresh processes. dlt would otherwise fork them from a process already running
# threads (extract and load pools, the resource sampler, Polars), which can deadlock the child.
start_method = "spawn"

[load]
# One job at a time: every job into a DuckDB file runs on its one connection, where each statement
# already uses `threads` cores, so parallel jobs add memory, not speed (five large merges at once
# were OOM-killed at ~7.4 GB). Raise it for Postgres.
workers = 1
# A job failing transiently (a deadlock, a dropped connection) is retried this many times within
# the load before the step fails; every framework retry of the step multiplies it.
raise_on_max_retries = 2
raise_on_failed_jobs = true
delete_completed_jobs = true
truncate_staging_dataset = true
start_new_jobs_on_signal = true

[pipelines]
restore_from_destination = true

[destination.duckdb.credentials.global_config]
# DuckDB's own settings, set as the file is opened (the file itself is a secret). Without a
# memory_limit DuckDB takes up to 80% of RAM; past it, what can spill goes to `<file>.tmp` beside
# the file. A merge dedups its staging rows with a window function, whose memory grows with
# threads. Raw tables need no insertion order.
memory_limit = "5GB"
threads = 2
preserve_insertion_order = false

[destination]
# Replace loads into staging, then swaps inside one transaction: no empty-table window.
replace_strategy = "insert-from-staging"
