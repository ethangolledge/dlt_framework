name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]  # the oldest supported and the newest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dlt
          POSTGRES_PASSWORD: dlt
          POSTGRES_DB: pipelines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dlt -d pipelines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.3"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends tesseract-ocr-eng  # OCR test language data
      - run: uv sync --frozen --group dev --all-extras
      - run: uv run ruff check dlt_framework tests .claude/skills/dlt-pipelines/scripts
      - run: uv run ruff format --check dlt_framework tests .claude/skills/dlt-pipelines/scripts
      - run: uv run lint-imports
      - run: uv run mypy dlt_framework
      - run: uv run pytest --cov=dlt_framework --cov-branch --cov-fail-under=90
        env:
          TEST_POSTGRES_URL: postgresql://dlt:dlt@localhost:5432/pipelines
      - if: matrix.python == '3.11'  # the image's Python
        run: docker build --build-arg EXTRAS="--extra duckdb --extra scrape" --tag dlt-framework:test .
