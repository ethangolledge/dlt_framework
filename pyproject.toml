[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "dlt-framework"
version = "0.2.0"
description = "Named dlt pipelines with incremental runs, backfills, and run monitoring"
requires-python = ">=3.11,<3.15"
# The core: runs, monitoring, REST and custom sources. Everything else is an extra, so a clone
# installs only the destinations and source types its pipelines use (README: Installing).
dependencies = [
    "dlt~=1.29.0",
    "polars>=2,<3",
    "psutil>=7,<8",
    "sqlalchemy>=2.1,<3",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
# Destinations
# DuckDB 2.0 removed relation.fetchmany(), which dlt (1.29 to 1.31) still uses to read CSV.
duckdb = ["dlt[duckdb]~=1.29.0", "duckdb>=1.5,<3"]
postgres = ["dlt[postgres]~=1.29.0"]
# Source types beyond REST and custom
sql = [
    "dlt[sql_database,parquet]~=1.29.0",
    "numpy>=2.4,<2.5",  # the pyarrow backend; one version for every supported Python
]
mssql = ["dlt-framework[sql]", "pymssql>=2.3,<3"]  # SQL Server; wheels bundle FreeTDS, no system driver
connectorx = ["dlt-framework[sql]", "connectorx>=0.4.2,<0.5"]
filesystem = ["dlt-framework[duckdb]", "dlt[filesystem,s3,parquet]~=1.29.0"]  # local and S3; duckdb reads CSV
gcs = ["dlt-framework[filesystem]", "dlt[gs]~=1.29.0"]  # gs:// buckets
azure = ["dlt-framework[filesystem]", "dlt[az]~=1.29.0"]  # az:// and abfs:// buckets
scrape = ["scrapling[fetchers]~=0.5.0"]  # plain HTTP; browser fetchers also need `scrapling install`
documents = ["anthropic>=2.3,<3", "liteparse~=2.17.0", "pydantic>=2.14,<3"]  # PDFs to rows, OCR

[project.scripts]
pipeline = "dlt_framework.cli:entrypoint"
pipeline-dashboard = "dashboard.app.terminal:entrypoint"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.15,<2",
    "pillow>=13,<14",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-psutil>=7.2.2.20260906",
]

[tool.uv.build-backend]
module-root = ""
module-name = ["dlt_framework", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["postgres: requires the TEST_POSTGRES_URL integration service"]
filterwarnings = [
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning:dlt.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Scrapling spiders are configured with class-level lists (start_urls, allowed_domains).
"dlt_framework/sources/scrape/**" = ["RUF012"]
"tests/test_scrape.py" = ["RUF012"]
# The dashboard writes counts as "killed ×3"; its tests assert that text.
"tests/dashboard/**" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fsspec.*"]  # untyped; installed with dlt
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["dlt_framework", "dashboard"]

[[tool.importlinter.contracts]]
name = "the framework never imports the dashboard"
type = "forbidden"
source_modules = ["dlt_framework"]
forbidden_modules = ["dashboard"]

[[tool.importlinter.contracts]]
name = "dashboard: app -> web -> model and render -> theme"
type = "layers"
layers = [
    "dashboard.app",
    "dashboard.web",
    "dashboard.model | dashboard.render",
    "dashboard.theme | dashboard.units",
]

[[tool.importlinter.contracts]]
name = "cli -> sources -> core; core never imports a source type"
type = "layers"
layers = ["dlt_framework.cli", "dlt_framework.sources", "dlt_framework.core"]

[[tool.importlinter.contracts]]
name = "source types are independent; shared code belongs in core"
type = "independence"
modules = [
    "dlt_framework.sources.custom",
    "dlt_framework.sources.filesystem",
    "dlt_framework.sources.rest",
    "dlt_framework.sources.scrape",
    "dlt_framework.sources.sql",
]
