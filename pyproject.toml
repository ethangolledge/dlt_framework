[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "dlt-framework"
version = "0.2.0"
description = "Named dlt pipelines with incremental runs, backfills, and run monitoring"
requires-python = ">=3.11,<3.15"
dependencies = [
    "dlt[duckdb,postgres,sql_database,filesystem,s3,parquet]~=1.29.0",
    "polars>=2,<3",
    "psutil>=7,<8",
    "sqlalchemy>=2.1,<3",
    "tenacity>=9.0,<10",
]

[project.scripts]
pipeline = "dlt_framework.cli:entrypoint"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-psutil>=7.2.2.20260906",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["postgres: requires the TEST_POSTGRES_URL integration service"]
filterwarnings = [
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning:dlt.*",
    "ignore:This process.*multi-threaded.*:DeprecationWarning:multiprocessing.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[tool.importlinter]
root_package = "dlt_framework"

[[tool.importlinter.contracts]]
name = "cli -> sources -> core; core never imports a source type"
type = "layers"
layers = ["dlt_framework.cli", "dlt_framework.sources", "dlt_framework.core"]

[[tool.importlinter.contracts]]
name = "source types are independent; shared code belongs in core"
type = "independence"
modules = [
    "dlt_framework.sources.custom",
    "dlt_framework.sources.filesystem",
    "dlt_framework.sources.rest",
    "dlt_framework.sources.sql",
]
