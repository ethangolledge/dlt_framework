[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dlt-pipeline-framework"
version = "0.2.0"
description = "A production-oriented dlt extraction foundation for isolated client deployments"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dlt[duckdb,postgres,sql_database,filesystem,s3,parquet]~=1.29.0",
    "tenacity>=9.0,<10",
]

[project.scripts]
dlt-framework = "dlt_framework.cli:entrypoint"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dlt_framework*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["postgres: requires the TEST_POSTGRES_URL integration service"]
filterwarnings = [
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning:dlt.*",
    "ignore:This process.*multi-threaded.*:DeprecationWarning:multiprocessing.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["dlt.*", "duckdb.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "dlt_framework"

[[tool.importlinter.contracts]]
name = "cli -> sources -> core; core never imports a source type"
type = "layers"
layers = ["dlt_framework.cli", "dlt_framework.sources", "dlt_framework.core"]

[[tool.importlinter.contracts]]
name = "source types are independent; shared code belongs in core"
type = "independence"
modules = [
    "dlt_framework.sources.custom",
    "dlt_framework.sources.filesystem",
    "dlt_framework.sources.rest",
    "dlt_framework.sources.sql",
]
